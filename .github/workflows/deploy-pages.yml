name: Publish site to GitHub Pages

# This file only PUBLISHES the site. It does not build or change it.
# The site is plain HTML, CSS and JavaScript.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Turn on GitHub Pages if it is off
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Collect the site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
